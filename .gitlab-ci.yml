stages:
  - build_image
  - test
  - build
  - docs
  - pages

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_DRIVER: overlay2
  IMAGE_NAME: "$CI_PROJECT_NAME-ci-image"

# Base template for jobs that use Docker-in-Docker
.dind_job_template:
  image: docker:27
  services:
    - name: docker:27-dind
  before_script:
    - apk add --no-cache bash
    - docker load -i ci-image.tar
    - docker images

# 1) Build the Alpine image from Dockerfile
build_image:
  stage: build_image
  image: docker:27
  services:
    - name: docker:27-dind
  script:
    - apk add --no-cache bash
    - docker info
    - docker build -t "$IMAGE_NAME" .
    - docker save "$IMAGE_NAME" -o ci-image.tar
  artifacts:
    paths:
      - ci-image.tar
    expire_in: 1 week

# 2) Run tests with `make test`
test:
  stage: test
  needs: ["build_image"]
  extends: .dind_job_template
  script:
    - echo "Using image: $IMAGE_NAME"
    - docker run --rm -v "$CI_PROJECT_DIR":/workspace -w /workspace "$IMAGE_NAME" make test
  artifacts:
    paths:
      - build/
    when: always

# 3) Build library with `make build`
build:
  stage: build
  needs: ["test"]
  extends: .dind_job_template
  script:
    - echo "Using image: $IMAGE_NAME"
    - docker run --rm -v "$CI_PROJECT_DIR":/workspace -w /workspace "$IMAGE_NAME" make build
  artifacts:
    paths:
      - build/
    when: always

# 4) Generate docs with `make doc`
docs:
  stage: docs
  needs: ["build"]
  extends: .dind_job_template
  script:
    - echo "Using image: $IMAGE_NAME"
    - docker run --rm -v "$CI_PROJECT_DIR":/workspace -w /workspace "$IMAGE_NAME" make doc
  artifacts:
    paths:
      - docs/html/
    expire_in: 1 week

# 5) Publish docs via GitLab Pages
pages:
  stage: pages
  needs: ["docs"]
  image: alpine:3.20
  script:
    - apk add --no-cache bash
    - mkdir -p public
    - cp -r docs/html/* public/
  artifacts:
    paths:
      - public/
  only:
    - main    # or master / another branch
