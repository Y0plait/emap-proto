---

stages:
  - build
  - test

services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

before_script:
  - docker info

build:
  stage: build
  image: docker:latest
  script:
    - docker build -t emap-image-dind .
    - docker run emap-image-dind echo "Build complete"

test:
  stage: test
  image: docker:latest
  script:
    - docker run --detach --name testing-container emap-image-dind
    - docker exec testing-container "make test"
    - docker stop testing-container
    - docker rm testing-container
